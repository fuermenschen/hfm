name: MariaDB Migration Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  mariadb-migration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mariadb:
        image: mariadb:lts
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: hfm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Laravel CI environment
        uses: ./.github/actions/laravel-ci-prepare
        timeout-minutes: 5
        env:
          COMPOSER_AUTH: >-
            {"http-basic":{"composer.fluxui.dev":{"username":"${{ secrets.FLUX_USERNAME }}","password":"${{ secrets.FLUX_LICENSE_KEY }}"}}}
        with:
          php-extensions: imagick,pdo_mysql
          setup-node: "false"
          install-node-dependencies: "false"
          bootstrap-laravel: "false"
          create-sqlite-database: "false"

      - name: Create MariaDB Test Environment
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else : > .env; fi
          {
            echo "APP_ENV=testing"
            echo "APP_DEBUG=true"
            echo "DB_CONNECTION=mariadb"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=hfm_test"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD=password"
          } >> .env

      - name: Generate Application Key
        run: php artisan key:generate --no-interaction

      - name: Wait for MariaDB to be ready
        run: |
          until php artisan db:show --database=mariadb; do
            echo "Waiting for MariaDB to be ready..."
            sleep 2
          done
        timeout-minutes: 2

      - name: Run Migration Tests
        run: |
          set -e
          echo "Testing fresh migrations..."
          php artisan migrate:fresh --force --database=mariadb --no-interaction

          echo "Testing stepwise rollback and re-run for steps 1..10..."
          for i in $(seq 1 10); do
            echo "Rolling back step=$i..."
            php artisan migrate:rollback --step=$i --database=mariadb --no-interaction
            echo "Re-running migrations..."
            php artisan migrate --force --database=mariadb --no-interaction
          done

          echo "Testing fresh migrations with seeding..."
          php artisan migrate:fresh --seed --force --database=mariadb --no-interaction
        timeout-minutes: 3

      - name: Run Basic Database Tests
        run: |
          # TODO: Restore --parallel when Pest issue #1774 is fixed.
          ./vendor/bin/pest --filter="Migration|Database|Model" --exclude-testsuite=Browser --stop-on-failure
        timeout-minutes: 3
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hfm_test
          DB_USERNAME: root
          DB_PASSWORD: password
