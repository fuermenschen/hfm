name: tests

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Laravel CI environment
        uses: ./.github/actions/laravel-ci-prepare
        timeout-minutes: 15
        env:
          COMPOSER_AUTH: >-
            {"http-basic":{"composer.fluxui.dev":{"username":"${{ secrets.FLUX_USERNAME }}","password":"${{ secrets.FLUX_LICENSE_KEY }}"}}}
        with:
          coverage: xdebug
          install-playwright: "true"
          build-assets: "true"

      - name: Run SCAN
        run: ./vendor/bin/phpstan analyse
        timeout-minutes: 3

      - name: Run Tests
        run: php artisan test --parallel
        timeout-minutes: 5

      - name: Upload Browser Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots/
          if-no-files-found: ignore
          retention-days: 7

  migration-tests:
    uses: ./.github/workflows/mariadb-migration-tests.yml
    secrets: inherit

  e2e-tests:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
