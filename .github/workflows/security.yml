name: security-checks

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "35 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile-consistency:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate lockfile consistency
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_SHA="$(git merge-base "${{ github.event.pull_request.base.sha }}" "$HEAD_SHA")"

          dependencies_changed() {
            local manifest="$1"
            local filter="$2"

            ! diff --brief \
              <(git show "$BASE_SHA:$manifest" | jq --sort-keys "$filter") \
              <(git show "$HEAD_SHA:$manifest" | jq --sort-keys "$filter") \
              >/dev/null
          }

          lockfile_unchanged() {
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$1"
          }

          if dependencies_changed package.json '{
            dependencies: (.dependencies // {}),
            devDependencies: (.devDependencies // {}),
            optionalDependencies: (.optionalDependencies // {}),
            peerDependencies: (.peerDependencies // {})
          }' && lockfile_unchanged package-lock.json; then
            echo "package.json dependencies changed without package-lock.json. Please update and commit package-lock.json."
            exit 1
          fi

          if dependencies_changed composer.json '{
            require: (.require // {}),
            "require-dev": (."require-dev" // {})
          }' && lockfile_unchanged composer.lock; then
            echo "composer.json dependencies changed without composer.lock. Please update and commit composer.lock."
            exit 1
          fi

          echo "Lockfile consistency check passed."

  composer-audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare PHP environment
        uses: ./.github/actions/laravel-ci-prepare
        timeout-minutes: 5
        with:
          setup-node: "false"
          install-php-dependencies: "false"
          install-node-dependencies: "false"
          bootstrap-laravel: "false"
          create-sqlite-database: "false"

      - name: Validate composer files
        run: composer validate --strict --no-check-publish

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Audit Composer advisories (fail on medium+)
        run: |
          set -euo pipefail
          composer audit --locked --format=json --no-interaction > composer-audit.json || true
          php -r '$data = json_decode(file_get_contents("composer-audit.json"), true); if (!is_array($data)) { fwrite(STDERR, "Failed to parse composer audit JSON\n"); exit(1);} $fail = false; foreach (($data["advisories"] ?? []) as $package => $advisories) { foreach ($advisories as $advisory) { $severity = strtolower((string) ($advisory["severity"] ?? "unknown")); if (in_array($severity, ["medium", "high", "critical"], true)) { $id = $advisory["advisoryId"] ?? ($advisory["cve"] ?? "unknown"); fwrite(STDERR, sprintf("[%s] %s (%s)\n", $severity, $package, $id)); $fail = true; } } } if ($fail) { exit(1);} echo "No medium/high/critical Composer advisories found.\n";'

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Node environment
        uses: ./.github/actions/laravel-ci-prepare
        timeout-minutes: 5
        with:
          setup-php: "false"
          install-php-dependencies: "false"
          install-node-dependencies: "false"
          bootstrap-laravel: "false"
          create-sqlite-database: "false"

      - name: Audit npm advisories (fail on high+)
        run: npm audit --audit-level=high --package-lock-only
