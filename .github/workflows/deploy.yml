name: Deploy and Seed Laravel App

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/copilot-instructions.md'
      - '.github/dependabot.yml'
      - '.github/skills/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONVENTIONS.md'
      - 'DEVELOPMENT_SETUP.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.idea/**'
      - '.vscode/**'
      - '.junie/**'
      - '.ai/**'
      - '.agents/**'
      - 'docs/**'
      - 'e2e/**'
      - 'e2e-results/**'
      - 'playwright-report/**'
      - '.phpunit.result.cache'
      - '.prettierignore'
      - '.prettierrc'
      - 'phpstan.neon'
      - 'phpunit.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit
    permissions:
      contents: write

  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write

  deploy:
    name: Deploy to Server
    needs:
      - lint
      - tests
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      pull-requests: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare deployment environment
        uses: ./.github/actions/laravel-ci-prepare
        timeout-minutes: 10
        env:
          COMPOSER_AUTH: >-
            {"http-basic":{"composer.fluxui.dev":{"username":"${{ secrets.FLUX_USERNAME }}","password":"${{ secrets.FLUX_LICENSE_KEY }}"}}}
        with:
          coverage: none
          bootstrap-laravel: "false"
          create-sqlite-database: "false"
          composer-install-command: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
          build-assets: "true"

      # Deploy built assets and PHP dependencies to the server
      - name: Deploy application files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.INFOMANIAK_SSH_SERVER }}
          username: ${{ secrets.INFOMANIAK_SSH_USER }}
          password: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          source: |
            public/build
          target: "/home/clients/6b0cacc0e2a85b554b958d48123932d8/sites/fuer-menschen.ch"

      # SSH into the server and finalize the deployment
      - name: Run Laravel deployment commands on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.INFOMANIAK_SSH_SERVER }}
          username: ${{ secrets.INFOMANIAK_SSH_USER }}
          password: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          script: |
            set -e  # Exit immediately if any command fails

            echo "Starting Deployment"

            PHP_BIN="/opt/php8.4/bin/php"
            COMPOSER_BIN="/opt/php8.4/bin/composer"

            cd /home/clients/6b0cacc0e2a85b554b958d48123932d8/sites/fuer-menschen.ch

            $PHP_BIN -r 'if (! extension_loaded("imagick")) { fwrite(STDERR, "Imagick PHP extension is required.\n"); exit(1); }'

            if $PHP_BIN artisan down; then
              echo "Application in maintenance mode."
            else
              echo "Failed to put application in maintenance mode. Continuing deployment..."
            fi

            echo "Fetching latest changes from the repository..."
            git fetch origin main || { echo "Git fetch failed! Exiting."; exit 1; }
            git reset --hard origin/main || { echo "Git reset to origin/main failed! Exiting."; exit 1; }

            echo "Decrypting environment file..."
            $PHP_BIN artisan env:decrypt --env=production --key=${{ secrets.ENV_PRODUCTION_KEY }} --force --filename=.env || { echo "Environment decryption failed! Exiting."; exit 1; }

            echo "Flux credentials loaded from ENV"
            $COMPOSER_BIN config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

            echo "Installing PHP dependencies on the server..."
            $COMPOSER_BIN install --no-dev --optimize-autoloader || { echo "Composer install failed! Exiting."; exit 1; }

            echo "Running database migrations..."
            $PHP_BIN artisan migrate --force || { echo "Migrations failed! Exiting."; exit 1; }

            echo "Optimizing application..."
            $PHP_BIN artisan optimize:clear || { echo "Optimization cache clear failed! Exiting."; exit 1; }
            $PHP_BIN artisan optimize || { echo "Optimization failed! Exiting."; exit 1; }

      - name: Bring the application back online
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.INFOMANIAK_SSH_SERVER }}
          username: ${{ secrets.INFOMANIAK_SSH_USER }}
          password: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          script: |
            set -e  # Exit immediately if any command fails

            cd /home/clients/6b0cacc0e2a85b554b958d48123932d8/sites/fuer-menschen.ch

            echo "Bringing application back online..."
            /opt/php8.4/bin/php artisan up

            echo "Deployment complete!"
