version: 2

registries:
  flux-pro:
    type: composer-repository
    url: https://composer.fluxui.dev
    username: ${{secrets.FLUX_USERNAME}}
    password: ${{secrets.FLUX_LICENSE_KEY}}

updates:
  # ─────────────────────────────────────────────
  # COMPOSER — weekly updates (grouped by semver impact)
  # ─────────────────────────────────────────────
  - package-ecosystem: "composer"
    directory: "/"
    registries:
      - flux-pro
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 2
    groups:
      composer-security:
        applies-to: security-updates
        patterns:
          - "*"
      composer-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      composer-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"

  # ─────────────────────────────────────────────
  # NPM — weekly updates (grouped by semver impact)
  # ─────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ─────────────────────────────────────────────
  # GITHUB ACTIONS — weekly (majors allowed)
  # ─────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
    open-pull-requests-limit: 2
